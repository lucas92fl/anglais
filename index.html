<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English for Engineers · Révisions</title>
<meta name="description" content="Quiz de vocabulaire et de grammaire du cours English for Future Engineers, avec suivi de progression.">
<meta name="theme-color" content="#2350d8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anglais">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: an engineer's revision notebook. Blueprint-blue accent on faint graph paper,
   one dashboard column of lesson cards, quizzes as a single focused card. */
:root {
  --bg: #eef2f6;
  --grid: rgba(35, 80, 216, .055);
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #142030;
  --muted: #5a6a7c;
  --line: #d7dfe8;
  --accent: #2350d8;
  --accent-ink: #ffffff;
  --accent-soft: #e4ebff;
  --hi: #f08a24;
  --good: #188357;
  --good-soft: #e1f4ea;
  --bad: #c8374f;
  --bad-soft: #fbe6ea;
  --shadow: 0 1px 2px rgba(20, 32, 48, .06), 0 6px 24px rgba(20, 32, 48, .06);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131b; --grid: rgba(120, 150, 255, .05); --surface: #151d28; --surface-2: #1a2431;
    --ink: #e5ecf4; --muted: #94a4b6; --line: #273445; --accent: #7397ff; --accent-ink: #0d131b;
    --accent-soft: #1d2a4a; --hi: #ffa257; --good: #4cc48d; --good-soft: #15332a; --bad: #ff7187; --bad-soft: #3a1b23;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131b; --grid: rgba(120, 150, 255, .05); --surface: #151d28; --surface-2: #1a2431;
  --ink: #e5ecf4; --muted: #94a4b6; --line: #273445; --accent: #7397ff; --accent-ink: #0d131b;
  --accent-soft: #1d2a4a; --hi: #ffa257; --good: #4cc48d; --good-soft: #15332a; --bad: #ff7187; --bad-soft: #3a1b23;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font: 16px/1.55 var(--body); min-height: 100vh;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 64px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 18px; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 600; }
.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.save { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.save.ok::before { content: "● "; color: var(--good); }
.save.busy::before { content: "● "; color: var(--hi); }
.save.err { color: var(--bad); }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 10px; font-weight: 500; transition: transform .08s, background .15s, border-color .15s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 8px 10px; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.sm { padding: 6px 12px; font-size: 14px; border-radius: 8px; }
.btn.big { padding: 13px 22px; font-size: 17px; border-radius: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* auth */
.auth { min-height: calc(100vh - 40px); display: grid; place-items: center; padding: 20px 16px; }
.auth-box { width: 100%; max-width: 440px; padding: 32px 28px; }
.auth-box h1 { font-size: 30px; margin: 14px 0 8px; }
.auth-box p { margin: 0 0 18px; color: var(--muted); }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 14px; font-weight: 500; }
.input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 16px; }
.input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin: 4px 0 18px; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
.err-msg { color: var(--bad); font-size: 14px; margin: -4px 0 12px; }
.auth-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

.mail { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 6px 0 18px; background: var(--surface-2); }
.mail-head { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.mail-head b { color: var(--ink); font-weight: 500; }
.mail-body { padding: 16px 14px; }
.mail-body p { color: var(--ink); margin: 0 0 10px; }
.pwd { font-family: var(--mono); font-size: 24px; font-weight: 600; letter-spacing: .04em; background: var(--surface); border: 1.5px dashed var(--accent); color: var(--accent); padding: 10px 14px; border-radius: 10px; text-align: center; user-select: all; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* dashboard */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 28px; padding: 26px; align-items: center; margin-bottom: 18px; }
.ring { position: relative; width: 148px; height: 148px; }
.ring svg { transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .num b { font-family: var(--display); font-size: 38px; font-weight: 800; display: block; line-height: 1; }
.ring .num span { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.hero h1 { font-size: 28px; margin-bottom: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { font-family: var(--mono); font-size: 20px; font-weight: 600; display: block; }
.stat span { font-size: 12.5px; color: var(--muted); }

.resume { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 16px 20px; margin-bottom: 18px; border-left: 5px solid var(--hi); flex-wrap: wrap; }
.resume h3 { font-size: 17px; }

.grid2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; margin-bottom: 26px; }
.panel { padding: 22px; }
.panel h2 { font-size: 21px; margin-bottom: 4px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.opts { display: grid; gap: 12px; margin: 16px 0 18px; }
.opts .lbl { font-size: 13px; color: var(--muted); margin-bottom: 5px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .04em; }

.sec-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 12px; gap: 10px; flex-wrap: wrap; }
.sec-title h2 { font-size: 22px; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-bottom: 28px; }
.lesson { padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.lesson-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.lnum { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.lesson h3 { font-size: 19px; margin-top: 3px; }
.lesson .sub { font-size: 13.5px; color: var(--muted); }
.pct { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
.pct small { font-size: 14px; color: var(--muted); font-weight: 500; }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 100px 1fr 42px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .mono { text-align: right; font-size: 12.5px; color: var(--muted); }
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.bar.g i { background: var(--hi); }
.lesson .row { margin-top: auto; }
.new { font-size: 11px; background: var(--hi); color: #fff; padding: 1px 7px; border-radius: 99px; margin-left: 6px; letter-spacing: 0; }
.tag { font-size: 12px; font-family: var(--mono); background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 6px; }

.hist { padding: 6px 0; }
.hist-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; padding: 10px 20px; border-top: 1px solid var(--line); font-size: 14px; align-items: center; }
.hist-row:first-child { border-top: 0; }
.score-pill { font-family: var(--mono); font-size: 12.5px; padding: 3px 9px; border-radius: 99px; font-weight: 600; }
.score-pill.hi { background: var(--good-soft); color: var(--good); }
.score-pill.mid { background: var(--accent-soft); color: var(--accent); }
.score-pill.lo { background: var(--bad-soft); color: var(--bad); }
.foot { margin-top: 30px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

/* quiz */
.quiz { max-width: 720px; margin: 0 auto; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.qprog { height: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
.qprog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.qcard { padding: 28px; }
.qmeta { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.qlabel { font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.qprompt { font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1.3; margin-bottom: 22px; text-wrap: pretty; }
.qprompt.word { font-size: 34px; color: var(--accent); }
.blank { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--accent); margin: 0 3px; }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--surface-2); padding: 13px 16px; border-radius: 11px; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 16px; transition: border-color .12s, background .12s; }
.choice:hover:not([disabled]) { border-color: var(--accent); background: var(--surface); }
.choice .k { font-family: var(--mono); font-size: 12px; width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); background: var(--surface); margin-top: 1px; }
.choice[disabled] { cursor: default; }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.right .k { background: var(--good); color: #fff; border-color: var(--good); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .k { background: var(--bad); color: #fff; border-color: var(--bad); }
.choice.dim { opacity: .55; }
.hint { font-size: 13.5px; color: var(--muted); margin: -8px 0 12px; font-family: var(--mono); }
.fb { margin-top: 18px; padding: 14px 16px; border-radius: 11px; font-size: 15px; }
.fb.ok { background: var(--good-soft); border: 1px solid var(--good); }
.fb.no { background: var(--bad-soft); border: 1px solid var(--bad); }
.fb b.t { display: block; margin-bottom: 4px; font-family: var(--display); font-size: 17px; }
.fb.ok b.t { color: var(--good); }
.fb.no b.t { color: var(--bad); }
.qfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; flex-wrap: wrap; }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots i { width: 14px; height: 6px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--good); }
.kbd { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.result { text-align: center; padding: 34px 28px; }
.result .big { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 1; margin: 14px 0 6px; }
.mist { text-align: left; margin-top: 24px; display: grid; gap: 10px; }
.mist div { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); font-size: 14.5px; }
.mist .q { font-weight: 500; margin-bottom: 4px; }
.mist .a { color: var(--good); }
.mist .y { color: var(--bad); text-decoration: line-through; }

/* sheet */
.sheet { max-width: 860px; margin: 0 auto; }
.sheet-body { padding: 26px; }
.sheet-body h3 { font-size: 19px; margin: 22px 0 10px; }
.sheet-body h3:first-child { margin-top: 0; }
.sheet-body p { max-width: 68ch; }
.sheet-body .ex { background: var(--surface-2); border-left: 4px solid var(--accent); padding: 10px 14px; border-radius: 0 8px 8px 0; }
.tbl { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 500; background: var(--surface-2); }
.vocab td:first-child { font-weight: 600; white-space: nowrap; }
.vocab td.s { color: var(--muted); font-size: 13.5px; }

/* modal & toast */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 16, 24, .45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { max-width: 420px; width: 100%; padding: 24px; }
.modal h3 { font-size: 20px; margin-bottom: 8px; }
.modal p { color: var(--muted); margin: 0 0 18px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 60; box-shadow: var(--shadow); }
.center { display: grid; place-items: center; min-height: 70vh; text-align: center; gap: 12px; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; justify-items: start; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: 1fr; }
  .qcard { padding: 20px; }
  .qprompt { font-size: 19px; }
  .qprompt.word { font-size: 28px; }
  .vocab td.s { display: none; }
}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spinner"></div><p class="muted">Chargement de ta session…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
